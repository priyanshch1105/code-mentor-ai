version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: code_mentor_user
      POSTGRES_PASSWORD: code_mentor_pass
      POSTGRES_DB: code_mentor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_mentor_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://code_mentor_user:code_mentor_pass@postgres:5432/code_mentor
      - AI_MODEL=openai/gpt-oss-120b
      - AI_FALLBACK_MODELS=llama-3.3-70b-versatile,llama-3.1-8b-instant
      - ENVIRONMENT=production
    expose:
      - "8000"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
