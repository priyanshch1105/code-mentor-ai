version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: code_mentor_postgres
    environment:
      POSTGRES_USER: code_mentor_user
      POSTGRES_PASSWORD: code_mentor_pass
      POSTGRES_DB: code_mentor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_mentor_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code_mentor_backend
    environment:
      - DATABASE_URL=postgresql://code_mentor_user:code_mentor_pass@postgres:5432/code_mentor
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: code_mentor_frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
